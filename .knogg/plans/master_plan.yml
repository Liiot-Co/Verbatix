stages:
- name: Stage 1 — PoC Streamlit
  goal: Prove discovery + classification pipeline from open survey answers.
  status: done
- name: Stage 2 — Migración React + FastAPI (Demo Liiot)
  goal: Replace Streamlit with Liiot design system UI (3 steps) backed by FastAPI. Step1 Upload/Discover → Step2 Entity review → Step3 Dashboard + export.
  status: in_progress
- name: Stage 3 — Classification quality
  goal: Context rules, ambiguous terms, re-processing rounds, quality metrics.
  status: todo
stages_append:
