services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file: .env
    environment:
      - KLASS_ENV=${APP_ENV:-dev}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
