services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verbatix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verbatix}
      POSTGRES_DB: ${POSTGRES_DB:-verbatix}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, in filename order, only on an empty data dir (first run
      # or after `docker compose down -v`). 000_ before 001_ is deliberate.
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verbatix}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file: .env
    environment:
      - APP_MODE=${APP_MODE:-local}
      - DATABASE_URL=${DATABASE_URL:-postgresql://verbatix:verbatix@db:5432/verbatix}
    volumes:
      # WORKDIR is /app (== backend/); local storage defaults to ../data/uploads
      # relative to that, i.e. /data/uploads here — mount it to the repo's ./data.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}

volumes:
  pgdata:
